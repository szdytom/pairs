name: Format check

on:
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          sudo add-apt-repository -y 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main'
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-22
          sudo ln -sf /usr/bin/clang-format-22 /usr/local/bin/clang-format

      - name: Check formatting
        run: |
          ./scripts/format-j.sh
          if ! git diff --exit-code; then
            echo "❌ Code is not formatted. Run ./scripts/format-j.sh locally and commit the changes."
            exit 1
          fi
