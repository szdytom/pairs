plugins {
    id 'application'
}

group = 'app.pairs'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation("io.github.libsdl4j:libsdl4j:2.28.4-1.6")
}

application {
	mainClass = 'app.pairs.Main'
	//applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

