plugins {
    id 'application'
}

group = 'app.pairs'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation("io.github.libsdl4j:libsdl4j:2.28.4-1.6")
    implementation("com.google.code.gson:gson:2.11.0")

    testImplementation("org.junit.jupiter:junit-jupiter:5.11.4")
    testImplementation("org.assertj:assertj-core:3.27.3")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.11.4")
}

application {
	mainClass = 'app.pairs.Main'
	//applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

// macOS-specific JVM configuration for SDL2:
// - Homebrew (Apple Silicon) installs SDL2 to /opt/homebrew, outside JNA's
//   default search path, so we pass the path via `jna.library.path`.
// - `-XstartOnFirstThread` is required because SDL2's Cocoa backend must run
//   on the native main thread (thread 0); without it AppKit throws
//   NSInternalInconsistencyException. macOS-only flag.
// Linux/Windows users adapt SDL2 setup themselves.
tasks.named('run') {
	if (System.properties['os.name'].toLowerCase().contains('mac')) {
		def sdl2Prefix = ['brew', '--prefix', 'sdl2'].execute().text.trim()
		if (sdl2Prefix) {
			jvmArgs "-Djna.library.path=${sdl2Prefix}/lib"
		}
		jvmArgs '-XstartOnFirstThread'
	}
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets {
    main {
        resources {
            srcDir 'assets'
        }
    }
}

tasks.test {
    useJUnitPlatform()
}
